name: Product UI Fastcheck

on:
  push:
    branches: [product-wallet-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      BLACKOUT_TOOLCHAIN_COMMIT: 5cfbfd0929e7a7bd2674b21b7769b4a35106e25c
    steps:
      - name: Checkout Safe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Checkout audited Compact devtools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mushee-io/Balckout-Pay
          ref: 5cfbfd0929e7a7bd2674b21b7769b4a35106e25c
          path: .blackout-toolchain
          persist-credentials: false
      - name: Pin Compact and generate browser binding
        run: |
          chmod +x .blackout-toolchain/bin/compact
          .blackout-toolchain/bin/compact update 0.31.1
          rm -rf contract/build-safe
          .blackout-toolchain/bin/compact compile --skip-zk contract/blackout_safe.compact contract/build-safe
      - name: Web security tests
        run: npm run test:web-security
      - name: Strict browser TypeScript
        run: npm run typecheck:web
      - name: Build Vite frontend
        run: npm run build:web:bundle
      - name: Verify product entry
        run: |
          test -f dist/index.html
          grep -q "BLACKOUT SAFE" dist/index.html
