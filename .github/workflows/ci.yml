name: Safe CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: safe-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BLACKOUT_TOOLCHAIN_COMMIT: 5cfbfd0929e7a7bd2674b21b7769b4a35106e25c

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Safe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Checkout audited Compact devtools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mushee-io/Balckout-Pay
          ref: ${{ env.BLACKOUT_TOOLCHAIN_COMMIT }}
          path: .blackout-toolchain
          persist-credentials: false

      - name: Verify audited toolchain source commit
        run: test "$(git -C .blackout-toolchain rev-parse HEAD)" = "$BLACKOUT_TOOLCHAIN_COMMIT"

      - name: Pin Compact toolchain 0.31.1
        run: |
          chmod +x .blackout-toolchain/bin/compact
          .blackout-toolchain/bin/compact update 0.31.1
          test "$(.blackout-toolchain/bin/compact compile --version)" = "0.31.1"
          test "$(.blackout-toolchain/bin/compact compile --ledger-version)" = "ledger-8.0.2"
          test "$(.blackout-toolchain/bin/compact compile --runtime-version)" = "0.16.0"

      - name: Generate deploy-sized Preview contract
        run: |
          node scripts/prepare-preview-contract.mjs
          node scripts/publicize-receipt-mode.mjs
          test -f contract/blackout_safe.preview.compact
          grep -q "export circuit receipt_statement" contract/blackout_safe.preview.compact
          grep -q "const mode = disclose(statement)" contract/blackout_safe.preview.compact
          if grep -q "export circuit receipt_quorum_authorized" contract/blackout_safe.preview.compact; then
            echo "BLACKOUT SAFE: legacy receipt export leaked into Preview contract"
            exit 1
          fi

      - name: Generate Safe bindings for TypeScript tests
        run: |
          rm -rf contract/build-safe
          .blackout-toolchain/bin/compact compile --skip-zk contract/blackout_safe.preview.compact contract/build-safe
          test -f contract/build-safe/contract/index.js

      - name: Protocol and adversarial tests
        run: npm test

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Full Compact compile and ZK key generation
        run: |
          rm -rf contract/build-safe
          .blackout-toolchain/bin/compact compile contract/blackout_safe.preview.compact contract/build-safe
          test -f contract/build-safe/compiler/contract-info.json

      - name: Enforce Preview deployment footprint
        run: node scripts/check-deployment-footprint.mjs

      - name: Stage browser ZK artifacts
        run: npm run midnight:assets

      - name: Verify compiler metadata, circuits and ZK artifacts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const f = require('./contract/build-safe/compiler/contract-info.json');
          if (f['compiler-version'] !== '0.31.1') throw new Error(`wrong compiler ${f['compiler-version']}`);
          if (f['language-version'] !== '0.23.0') throw new Error(`wrong language ${f['language-version']}`);
          if (f['runtime-version'] !== '0.16.0') throw new Error(`wrong runtime ${f['runtime-version']}`);
          const required = [
            'propose_private','approve_private','prove_quorum','deposit_shielded','execute_shielded_transfer',
            'governance_pause','governance_resume','governance_cancel_proposal','governance_rotate_membership',
            'governance_change_policy','receipt_statement'
          ];
          const actual = new Set(f.circuits.map((c) => c.name));
          if (f.circuits.length !== required.length) throw new Error(`unexpected circuit count ${f.circuits.length}`);
          for (const name of required) if (!actual.has(name)) throw new Error(`missing circuit ${name}`);
          for (const dir of ['contract/build-safe/contract','contract/build-safe/zkir','contract/build-safe/keys']) {
            if (!fs.existsSync(dir) || fs.readdirSync(dir).length === 0) throw new Error(`missing generated artifacts in ${dir}`);
          }
          const staged = 'public/zk-artifacts/blackout-safe';
          if (!fs.existsSync(`${staged}/keys`) || !fs.existsSync(`${staged}/zkir`)) throw new Error('browser artifacts not staged');
          if (!fs.existsSync(`${staged}/keys/receipt_statement.prover`)) throw new Error('unified receipt prover not staged');
          console.log(`BLACKOUT SAFE: full ZK build verified for ${required.length} exported circuits`);
          NODE

      - name: Strict browser TypeScript
        run: npm run typecheck:web

      - name: Build Vite frontend
        run: npm run build:web:bundle

      - name: Verify deployable web output
        run: |
          test -f dist/index.html
          test -f dist/zk-artifacts/blackout-safe/keys/propose_private.prover
          test -f dist/zk-artifacts/blackout-safe/zkir/propose_private.bzkir
          test -f dist/zk-artifacts/blackout-safe/keys/receipt_statement.prover
          test -f dist/zk-artifacts/blackout-safe/zkir/receipt_statement.bzkir
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "BLACKOUT SAFE: production source maps must not be published"
            exit 1
          fi
          echo "BLACKOUT SAFE: deployable frontend + proving assets verified"

      - name: Upload generated Safe artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blackout-safe-compact-0.31.1
          retention-days: 7
          if-no-files-found: error
          path: |
            contract/build-safe/contract
            contract/build-safe/compiler/contract-info.json
            contract/build-safe/keys
            contract/build-safe/zkir
