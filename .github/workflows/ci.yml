name: Safe CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Safe
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Protocol tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Checkout Blackout Compact devtools
        uses: actions/checkout@v4
        with:
          repository: mushee-io/Balckout-Pay
          path: .blackout-toolchain
      - name: Pin Compact toolchain 0.31.1
        run: |
          chmod +x .blackout-toolchain/bin/compact
          .blackout-toolchain/bin/compact --version
          .blackout-toolchain/bin/compact update 0.31.1
          .blackout-toolchain/bin/compact compile --version
          .blackout-toolchain/bin/compact compile --ledger-version
          .blackout-toolchain/bin/compact compile --runtime-version
      - name: Apply candidate Compact fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('contract/blackout_safe.compact')
          s = p.read_text()

          replacements = [
            (
              '  assert(blockTimeGte(disclose(payload.created_at + policy.min_execution_delay)), "BLACKOUT_SAFE_EXECUTION_DELAY");',
              '  const execute_after = (payload.created_at + policy.min_execution_delay) as Uint<64>;\n  assert(blockTimeGte(disclose(execute_after)), "BLACKOUT_SAFE_EXECUTION_DELAY");'
            ),
            (
              '  approval_nullifiers.insert(nullifier);\n  proposals.insert(disclose(proposal_commitment), ProposalRecord {',
              '  approval_nullifiers.insert(nullifier);\n  assert(proposal.approval_count != 18446744073709551615, "BLACKOUT_SAFE_APPROVAL_COUNT_OVERFLOW");\n  const next_approval_count = (proposal.approval_count + 1) as Uint<64>;\n  proposals.insert(disclose(proposal_commitment), ProposalRecord {'
            ),
            (
              '    approval_count: proposal.approval_count + 1,',
              '    approval_count: next_approval_count,'
            ),
            (
              '  assert(next.membership_version == membership_version + 1, "BLACKOUT_SAFE_ROTATION_MEMBERSHIP_VERSION_INVALID");',
              '  assert(membership_version != 18446744073709551615, "BLACKOUT_SAFE_MEMBERSHIP_VERSION_OVERFLOW");\n  const next_membership_version = (membership_version + 1) as Uint<64>;\n  assert(next.membership_version == next_membership_version, "BLACKOUT_SAFE_ROTATION_MEMBERSHIP_VERSION_INVALID");'
            ),
            (
              '  membership_version = membership_version + 1;',
              '  membership_version = next_membership_version;'
            ),
            (
              '  assert(next.policy_version == policy_version + 1, "BLACKOUT_SAFE_NEW_POLICY_VERSION_INVALID");',
              '  assert(policy_version != 18446744073709551615, "BLACKOUT_SAFE_POLICY_VERSION_OVERFLOW");\n  const next_policy_version = (policy_version + 1) as Uint<64>;\n  assert(next.policy_version == next_policy_version, "BLACKOUT_SAFE_NEW_POLICY_VERSION_INVALID");'
            ),
          ]

          for old, new in replacements:
            assert old in s, f'expected source not found: {old[:80]}'
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Compile Safe Compact
        run: |
          rm -rf contract/build-safe
          .blackout-toolchain/bin/compact compile contract/blackout_safe.compact contract/build-safe
          test -f contract/build-safe/compiler/contract-info.json
      - name: Verify compiler metadata
        run: |
          node -e "const f=require('./contract/build-safe/compiler/contract-info.json'); if(f['compiler-version']!=='0.31.1') throw new Error('wrong compiler '+f['compiler-version']); if(f['language-version']!=='0.23.0') throw new Error('wrong language '+f['language-version']); if(f['runtime-version']!=='0.16.0') throw new Error('wrong runtime '+f['runtime-version']); console.log(f)"
      - name: Compact artifact sanity
        run: |
          test -d contract/build-safe/contract
          test -d contract/build-safe/zkir
          test -d contract/build-safe/keys
